name: Create v1.0.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "v1.0.0 — Initial public release" \
            --notes-file - <<'EOF'
          First public release of **ホットピクセルの一生**.

          This snapshot includes:
          - the Quarto technical note and reproducible Python source;
          - Bilinear and Malvar–He–Cutler demosaicing experiments;
          - WB / CCM / clipping, noise, CFA-phase, edge-orientation, and RGB-cube visualizations;
          - the rendered GitHub Pages site;
          - dual licensing: MIT for code and CC BY 4.0 for article content and original figures;
          - `CITATION.cff` for citation metadata.

          Article: https://goldkiss2010-ai.github.io/hot-pixel-journey-public/
          EOF
